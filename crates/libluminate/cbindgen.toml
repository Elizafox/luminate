language = "C"
cpp_compat = true
include_version = true
documentation = true
# `stdbool.h`/`stdint.h` are already added by cbindgen's own auto-detection;
# `string.h` is only needed by the hand-written `memcmp` helper in `trailer`.
sys_includes = ["string.h"]

[fn]
prefix = "LUMINATE_API"
must_use = "LUMINATE_NODISCARD"

[enum]
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false

[export]
exclude = [
  "VERSION_CSTR",
]
