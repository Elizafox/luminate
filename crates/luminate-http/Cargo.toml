[package]
name = "luminate-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Optional HTTP companion service for Luminate"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = [
  "server-auto",
  "server-graceful",
  "service",
  "tokio",
] }
libluminate.workspace = true
luminate-platform.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower-http = { workspace = true, features = [
  "cors",
  "limit",
  "sensitive-headers",
  "timeout",
  "trace",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, features = ["preserve_order", "chrono"] }
uuid.workspace = true
x509-parser.workspace = true
axum = { workspace = true, features = ["json", "ws"] }

[dev-dependencies]
luminate-platform = { workspace = true, features = ["test-support"] }
luminate-protocol.workspace = true

[lints]
workspace = true
