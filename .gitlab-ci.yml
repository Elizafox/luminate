default:
  image: rust:1.96.1-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libudev-dev pkg-config
  cache:
    key:
      files:
        - Cargo.lock
      prefix: $CI_JOB_NAME
    paths:
      - .cargo/registry/
      - target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_TERM_COLOR: always

stages:
  - check
  - test
  - compatibility

format:
  stage: check
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libudev-dev pkg-config
    - rustup component add clippy
  script:
    - cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

test:
  stage: test
  script:
    - cargo test --locked --workspace --all-features

conformance:
  stage: test
  script:
    - cargo test --locked -p luminated --test plugin_conformance -- --ignored
    - cargo test --locked -p luminated --test policy_conformance -- --ignored

audit:
  stage: test
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cargo audit

generated-header:
  stage: compatibility
  before_script:
    - cargo install cbindgen --version 0.29.4 --locked
  script:
    - cbindgen --config crates/libluminate/cbindgen.toml --crate libluminate --output crates/libluminate/luminate.h
    - git diff --exit-code -- crates/libluminate/luminate.h

msrv:
  stage: compatibility
  image: rust:1.88-bookworm
  variables:
    # Override rust-toolchain.toml with this image's Rust 1.88 toolchain.
    RUSTUP_TOOLCHAIN: stable
  script:
    - cargo build --locked --workspace --all-features
