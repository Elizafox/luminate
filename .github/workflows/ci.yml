name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  platform-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            runner: ubuntu-24.04
            smoke: scripts/smoke-test-linux.sh
          - name: macOS (Apple Silicon)
            runner: macos-15
            smoke: scripts/smoke-test-macos.sh --require-dbus
          - name: macOS (Intel)
            runner: macos-15-intel
            smoke: scripts/smoke-test-macos.sh --require-dbus
          - name: Windows (x86_64)
            runner: windows-2025
            smoke: scripts/smoke-test-windows.ps1

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus libudev-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install dbus llvm

      - name: Install Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy --component rustfmt

      - name: Restore Cargo dependency cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-1.97.1-

      - name: Resolve locked dependencies
        run: cargo fetch --locked

      - name: Run platform smoke test
        if: runner.os != 'Windows'
        run: ${{ matrix.smoke }}

      - name: Run platform smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1

  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config

      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Restore Cargo dependency cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-1.89.0-

      - name: Check workspace with minimum Rust
        run: cargo +1.89.0 check --locked --workspace --all-targets --all-features
